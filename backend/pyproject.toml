[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gadded"
version = "0.2.0"
description = "AI-driven solar pre-development decision support for Egyptian factories"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1", "build>=1,<2"]
notebook = ["matplotlib>=3.9,<4", "notebook>=7,<8", "nbconvert>=7,<8", "ipykernel>=6,<8", "python-dotenv>=1,<2", "xhtml2pdf>=0.2,<1", "pypdf>=5,<7"]
legacy = ["streamlit>=1.40,<2", "matplotlib>=3.9,<4", "python-dotenv>=1,<2"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements/runtime.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
